<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Poly Model Viewer (Optimized)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: sans-serif;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            pointer-events: none;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">
        <h1>Optimized Model Viewer</h1>
        <p>WASD: Move | SPACE: Up | SHIFT: Down | Mouse: Look</p>
        <p>Click to capture cursor</p>
        <p id="stats">Loading...</p>
    </div>
    <div id="loading">Loading Model...</div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // Configuration
        const MODEL_PATH = 'assets/docs/school_optimized.glb'; // Renamed to avoid encoding issues
        const MOVEMENT_SPEED = 10.0; // m/s
        const BOOST_MULTIPLIER = 3.0;

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue
        scene.fog = new THREE.Fog(0x87CEEB, 10, 500);

        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // Controls
        const controls = new PointerLockControls(camera, document.body);

        document.body.addEventListener('click', () => {
            controls.lock();
        });

        controls.addEventListener('lock', () => {
            console.log('Pointer Locked');
        });

        controls.addEventListener('unlock', () => {
            console.log('Pointer Unlocked');
        });

        scene.add(controls.getObject());

        // Movement State
        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            up: false,
            down: false,
            sprint: false
        };

        const onKeyDown = (event) => {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW': moveState.forward = true; break;
                case 'ArrowLeft':
                case 'KeyA': moveState.left = true; break;
                case 'ArrowDown':
                case 'KeyS': moveState.backward = true; break;
                case 'ArrowRight':
                case 'KeyD': moveState.right = true; break;
                case 'Space': moveState.up = true; break;
                case 'ShiftLeft':
                case 'ShiftRight': moveState.down = true; break;
            }
        };

        const onKeyUp = (event) => {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW': moveState.forward = false; break;
                case 'ArrowLeft':
                case 'KeyA': moveState.left = false; break;
                case 'ArrowDown':
                case 'KeyS': moveState.backward = false; break;
                case 'ArrowRight':
                case 'KeyD': moveState.right = false; break;
                case 'Space': moveState.up = false; break;
                case 'ShiftLeft':
                case 'ShiftRight': moveState.down = false; break;
            }
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // Load Model
        const loader = new GLTFLoader();

        // Draco Loader Setup
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
        loader.setDRACOLoader(dracoLoader);

        const loadingEl = document.getElementById('loading');
        const statsEl = document.getElementById('stats');

        loader.load(
            MODEL_PATH,
            (gltf) => {
                loadingEl.style.display = 'none';
                scene.add(gltf.scene);

                gltf.scene.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                console.log('Model loaded');
                statsEl.innerText = 'Model Loaded';
            },
            (xhr) => {
                const percent = (xhr.loaded / xhr.total * 100).toFixed(1);
                loadingEl.innerText = `Loading Model... ${percent}%`;
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            (error) => {
                console.error('An error happened', error);
                loadingEl.innerText = 'Error loading model: ' + error.message;
                statsEl.innerText = 'Error: ' + error.message;
            }
        );

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (controls.isLocked) {
                const speed = MOVEMENT_SPEED * (moveState.sprint ? BOOST_MULTIPLIER : 1.0);
                const actualSpeed = speed * delta;

                if (moveState.forward) controls.moveForward(actualSpeed);
                if (moveState.backward) controls.moveForward(-actualSpeed);
                if (moveState.right) controls.moveRight(actualSpeed);
                if (moveState.left) controls.moveRight(-actualSpeed);

                if (moveState.up) controls.getObject().position.y += actualSpeed;
                if (moveState.down) controls.getObject().position.y -= actualSpeed;
            }

            renderer.render(scene, camera);
        }

        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
