  </defs>
  <rect width="320" height="200" rx="20" fill="url(#thumb)"/>
  <rect x="16" y="16" width="288" height="168" rx="16" fill="url(#grid)" opacity="0.4"/>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" fill="#4a4a4a">MODEL PREVIEW</text>
</svg>

