      <stop offset="0%" stop-color="#d1ecff"/>
      <stop offset="100%" stop-color="#a3d2ff"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="#ffffff" stroke-width="0.5"/>
