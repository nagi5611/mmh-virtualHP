<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>球面鏡シミュレーション</title>
  <meta name="description" content="球面鏡（凹面鏡・凸面鏡）の像のでき方を視覚的に学べるインタラクティブシミュレーション">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-card: #1a2035;
      --bg-card-hover: #1f2945;
      --text-primary: #e8ecf4;
      --text-secondary: #8b95a8;
      --text-muted: #5a6478;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-orange: #f59e0b;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --accent-pink: #ec4899;
      --border-color: #2a3450;
      --glow-blue: rgba(59, 130, 246, 0.3);
      --glow-cyan: rgba(6, 182, 212, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(139, 92, 246, 0.04) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px 20px 12px;
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.9) 0%, transparent 100%);
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.05em;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 12px 20px 30px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
    }

    /* Canvas area */
    .canvas-wrapper {
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.03);
    }

    canvas {
      display: block;
      width: 100%;
      cursor: grab;
    }

    canvas:active { cursor: grabbing; }

    .canvas-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(10, 14, 26, 0.8);
      padding: 4px 14px;
      border-radius: 20px;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    /* Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      padding: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      transition: border-color 0.3s;
    }

    .card:hover {
      border-color: rgba(59, 130, 246, 0.3);
    }

    .card-title {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title .icon {
      font-size: 0.9rem;
    }

    /* Mirror type toggle */
    .mirror-toggle {
      display: flex;
      background: var(--bg-primary);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .mirror-toggle button {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      color: var(--text-secondary);
      background: transparent;
    }

    .mirror-toggle button.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      box-shadow: 0 2px 12px var(--glow-blue);
    }

    .mirror-toggle button:not(.active):hover {
      color: var(--text-primary);
      background: var(--bg-card);
    }

    /* Sliders */
    .slider-group {
      margin-top: 10px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .slider-value {
      font-family: 'Inter', monospace;
      font-weight: 500;
      color: var(--accent-cyan);
      font-size: 0.82rem;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--bg-primary);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      cursor: pointer;
      box-shadow: 0 0 8px var(--glow-cyan);
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      cursor: pointer;
      border: none;
      box-shadow: 0 0 8px var(--glow-cyan);
    }

    /* Formula display */
    .formula-box {
      background: var(--bg-primary);
      border-radius: 10px;
      padding: 14px;
      font-family: 'Inter', monospace;
      font-size: 0.88rem;
      line-height: 1.8;
      border: 1px solid var(--border-color);
    }

    .formula-box .formula-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .formula-box .label {
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .formula-box .value {
      font-weight: 500;
    }

    .formula-box .value.positive { color: var(--accent-cyan); }
    .formula-box .value.negative { color: var(--accent-orange); }
    .formula-box .value.infinity { color: var(--accent-pink); }

    .formula-main {
      text-align: center;
      font-size: 1.1rem;
      padding: 8px 0;
      color: var(--accent-blue);
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 10px;
      font-weight: 500;
    }

    /* Image properties */
    .image-props {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .prop-tag {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .prop-tag.real { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .prop-tag.virtual { background: rgba(236, 72, 153, 0.15); color: var(--accent-pink); border: 1px solid rgba(236, 72, 153, 0.3); }
    .prop-tag.inverted { background: rgba(245, 158, 11, 0.15); color: var(--accent-orange); border: 1px solid rgba(245, 158, 11, 0.3); }
    .prop-tag.upright { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); border: 1px solid rgba(6, 182, 212, 0.3); }
    .prop-tag.enlarged { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); border: 1px solid rgba(139, 92, 246, 0.3); }
    .prop-tag.reduced { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
    .prop-tag.same { background: rgba(255, 255, 255, 0.08); color: var(--text-secondary); border: 1px solid rgba(255,255,255,0.1); }
    .prop-tag.none { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }

    .explanation-text {
      margin-top: 10px;
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--text-secondary);
      padding: 10px;
      background: var(--bg-primary);
      border-radius: 8px;
      border-left: 3px solid var(--accent-blue);
    }

    /* Ray toggle checkboxes */
    .ray-toggles {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ray-toggle-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .ray-toggle-item input[type="checkbox"] {
      display: none;
    }

    .ray-check {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .ray-check::after {
      content: '✓';
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .ray-toggle-item input:checked + .ray-check {
      border-color: currentColor;
      background: currentColor;
    }

    .ray-toggle-item input:checked + .ray-check::after {
      opacity: 1;
      color: var(--bg-primary);
    }

    .ray-color-1 { color: var(--accent-red); }
    .ray-color-2 { color: var(--accent-green); }
    .ray-color-3 { color: var(--accent-blue); }

    /* Object height slider */
    .object-height-control {
      margin-top: 8px;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .app-container {
        grid-template-columns: 1fr;
      }
      header h1 { font-size: 1.3rem; }
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card { animation: fadeIn 0.5s ease-out backwards; }
    .card:nth-child(2) { animation-delay: 0.05s; }
    .card:nth-child(3) { animation-delay: 0.1s; }
    .card:nth-child(4) { animation-delay: 0.15s; }
    .card:nth-child(5) { animation-delay: 0.2s; }
  </style>
</head>
<body>
  <header>
    <h1>🪞 球面鏡シミュレーション</h1>
    <p>ろうそくをドラッグして像のでき方を観察しよう</p>
  </header>

  <div class="app-container">
    <div class="canvas-wrapper">
      <canvas id="mirrorCanvas"></canvas>
      <div class="canvas-hint" id="hint">← ろうそくをドラッグして動かそう →</div>
    </div>

    <div class="sidebar">
      <!-- Mirror type -->
      <div class="card">
        <div class="card-title"><span class="icon">🔄</span> 鏡の種類</div>
        <div class="mirror-toggle">
          <button class="active" data-type="concave">凹面鏡</button>
          <button data-type="convex">凸面鏡</button>
        </div>
      </div>

      <!-- Controls -->
      <div class="card">
        <div class="card-title"><span class="icon">⚙️</span> パラメータ</div>
        <div class="slider-group">
          <div class="slider-label">
            <span>焦点距離 (f)</span>
            <span class="slider-value" id="focalValue">150 px</span>
          </div>
          <input type="range" id="focalSlider" min="60" max="250" value="150" step="5">
        </div>
        <div class="slider-group object-height-control">
          <div class="slider-label">
            <span>物体の高さ</span>
            <span class="slider-value" id="heightValue">80 px</span>
          </div>
          <input type="range" id="heightSlider" min="30" max="140" value="80" step="5">
        </div>
      </div>

      <!-- Ray toggles -->
      <div class="card">
        <div class="card-title"><span class="icon">💡</span> 光線の表示</div>
        <div class="ray-toggles">
          <label class="ray-toggle-item ray-color-1">
            <input type="checkbox" id="ray1" checked>
            <span class="ray-check"></span>
            <span>① 光軸に平行な光線</span>
          </label>
          <label class="ray-toggle-item ray-color-2">
            <input type="checkbox" id="ray2" checked>
            <span class="ray-check"></span>
            <span>② 焦点を通る光線</span>
          </label>
          <label class="ray-toggle-item ray-color-3">
            <input type="checkbox" id="ray3" checked>
            <span class="ray-check"></span>
            <span>③ 中心を通る光線</span>
          </label>
        </div>
      </div>

      <!-- Formula -->
      <div class="card">
        <div class="card-title"><span class="icon">📐</span> 鏡の公式</div>
        <div class="formula-box">
          <div class="formula-main">1/f = 1/a + 1/b</div>
          <div class="formula-row">
            <span class="label">焦点距離 f</span>
            <span class="value positive" id="dispF">150.0</span>
          </div>
          <div class="formula-row">
            <span class="label">物体距離 a</span>
            <span class="value positive" id="dispA">300.0</span>
          </div>
          <div class="formula-row">
            <span class="label">像距離 b</span>
            <span class="value positive" id="dispB">300.0</span>
          </div>
          <div class="formula-row">
            <span class="label">倍率 m = -b/a</span>
            <span class="value negative" id="dispM">-1.00</span>
          </div>
        </div>
      </div>

      <!-- Image properties -->
      <div class="card">
        <div class="card-title"><span class="icon">🖼️</span> 像の性質</div>
        <div class="image-props" id="imageProps">
          <span class="prop-tag real">実像</span>
          <span class="prop-tag inverted">倒立</span>
          <span class="prop-tag same">等倍</span>
        </div>
        <div class="explanation-text" id="explanation">
          物体が曲率中心(C)の位置にあるとき、等倍の倒立実像が曲率中心に生じます。
        </div>
      </div>
    </div>
  </div>

  <script>
    // ======== Configuration ========
    const canvas = document.getElementById('mirrorCanvas');
    const ctx = canvas.getContext('2d');

    let W, H, scale;
    let mirrorType = 'concave'; // 'concave' or 'convex'
    let focalLength = 150;
    let objectHeight = 80;
    let objectX = 300; // distance from mirror (positive = left of mirror)
    let dragging = false;
    let hintTimeout;

    // Ray visibility
    let showRay1 = true, showRay2 = true, showRay3 = true;

    // Mirror position on canvas (x coordinate of mirror vertex)
    let mirrorX, mirrorY; // center of mirror on canvas

    // ======== Resize ========
    function resize() {
      const wrapper = canvas.parentElement;
      const rect = wrapper.getBoundingClientRect();
      scale = window.devicePixelRatio || 1;
      W = rect.width;
      H = Math.max(460, Math.min(W * 0.55, 600));
      canvas.width = W * scale;
      canvas.height = H * scale;
      canvas.style.height = H + 'px';
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      mirrorX = W * 0.72;
      mirrorY = H / 2;
      draw();
    }

    window.addEventListener('resize', resize);

    // ======== Drawing functions ========
    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawGrid();
      drawOpticalAxis();
      drawMirror();
      drawSpecialPoints();
      drawObject();

      const imageInfo = computeImage();
      if (showRay1) drawRay1(imageInfo);
      if (showRay2) drawRay2(imageInfo);
      if (showRay3) drawRay3(imageInfo);

      if (imageInfo.valid) {
        drawImage(imageInfo);
      }

      updateUI(imageInfo);
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      const step = 50;
      for (let x = step; x < W; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = step; y < H; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
    }

    function drawOpticalAxis() {
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(0, mirrorY);
      ctx.lineTo(W, mirrorY);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawMirror() {
      const f = focalLength;
      const R = f * 2;
      const mirrorHalfHeight = H * 0.38;

      ctx.lineWidth = 3;

      if (mirrorType === 'concave') {
        // Concave mirror: curves toward the left (center of curvature on left)
        // Draw as arc of circle
        const angle = Math.asin(Math.min(mirrorHalfHeight / R, 0.99));
        const centerX = mirrorX - R; // center of curvature to the left

        // Mirror surface gradient
        const grad = ctx.createLinearGradient(mirrorX - 10, mirrorY - mirrorHalfHeight, mirrorX + 5, mirrorY + mirrorHalfHeight);
        grad.addColorStop(0, '#60a5fa');
        grad.addColorStop(0.5, '#93c5fd');
        grad.addColorStop(1, '#60a5fa');
        ctx.strokeStyle = grad;

        ctx.beginPath();
        ctx.arc(centerX, mirrorY, R, -angle, angle);
        ctx.stroke();

        // Back hatching (to indicate reflecting surface is on the left)
        ctx.strokeStyle = 'rgba(96, 165, 250, 0.25)';
        ctx.lineWidth = 1;
        const steps = 18;
        for (let i = 0; i <= steps; i++) {
          const a = -angle + (2 * angle * i / steps);
          const px = centerX + R * Math.cos(a);
          const py = mirrorY + R * Math.sin(a);
          // small tick marks on the back side
          const nx = Math.cos(a);
          const ny = Math.sin(a);
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px + nx * 8, py + ny * 8);
          ctx.stroke();
        }
      } else {
        // Convex mirror: curves toward the right (center of curvature on right/behind mirror)
        const angle = Math.asin(Math.min(mirrorHalfHeight / R, 0.99));
        const centerX = mirrorX + R; // center of curvature behind

        const grad = ctx.createLinearGradient(mirrorX - 5, mirrorY - mirrorHalfHeight, mirrorX + 10, mirrorY + mirrorHalfHeight);
        grad.addColorStop(0, '#f472b6');
        grad.addColorStop(0.5, '#f9a8d4');
        grad.addColorStop(1, '#f472b6');
        ctx.strokeStyle = grad;

        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(centerX, mirrorY, R, Math.PI - angle, Math.PI + angle);
        ctx.stroke();

        // Back hatching
        ctx.strokeStyle = 'rgba(244, 114, 182, 0.25)';
        ctx.lineWidth = 1;
        const steps = 18;
        for (let i = 0; i <= steps; i++) {
          const a = Math.PI - angle + (2 * angle * i / steps);
          const px = centerX + R * Math.cos(a);
          const py = mirrorY + R * Math.sin(a);
          const nx = Math.cos(a);
          const ny = Math.sin(a);
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(px + nx * 8, py + ny * 8);
          ctx.stroke();
        }
      }
    }

    function drawSpecialPoints() {
      const f = focalLength;
      const fSign = mirrorType === 'concave' ? 1 : -1;

      // Focal point F
      const fX = mirrorX - f * fSign;
      drawPointLabel(fX, mirrorY, 'F', mirrorType === 'concave' ? '#06b6d4' : '#f472b6');

      // Center of curvature C
      const cX = mirrorX - 2 * f * fSign;
      drawPointLabel(cX, mirrorY, 'C', mirrorType === 'concave' ? '#8b5cf6' : '#c084fc');

      // Vertex V
      drawPointLabel(mirrorX, mirrorY, 'V', '#94a3b8');
    }

    function drawPointLabel(x, y, label, color) {
      // Point dot
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      // Glow
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fillStyle = color.replace(')', ', 0.15)').replace('rgb', 'rgba').replace('#', '');
      // use hex conversion for glow
      const r = parseInt(color.slice(1,3), 16);
      const g = parseInt(color.slice(3,5), 16);
      const b = parseInt(color.slice(5,7), 16);
      ctx.fillStyle = `rgba(${r},${g},${b},0.2)`;
      ctx.fill();

      // Label
      ctx.fillStyle = color;
      ctx.font = '600 14px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, y + 22);
    }

    // ======== Draw Object (Candle) ========
    function drawObject() {
      const objCanvasX = mirrorX - objectX;
      const topY = mirrorY - objectHeight;

      // Candle body
      const candleWidth = 10;
      const grad = ctx.createLinearGradient(objCanvasX - candleWidth/2, topY, objCanvasX + candleWidth/2, mirrorY);
      grad.addColorStop(0, '#fef3c7');
      grad.addColorStop(0.3, '#fde68a');
      grad.addColorStop(1, '#f59e0b');
      ctx.fillStyle = grad;

      // Rounded rect body
      const bodyTop = topY + 16;
      ctx.beginPath();
      ctx.roundRect(objCanvasX - candleWidth/2, bodyTop, candleWidth, mirrorY - bodyTop, 2);
      ctx.fill();

      // Wick
      ctx.strokeStyle = '#78716c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(objCanvasX, bodyTop);
      ctx.lineTo(objCanvasX, bodyTop - 6);
      ctx.stroke();

      // Flame
      drawFlame(objCanvasX, topY + 4, 1);

      // Object arrow tip (for clarity)
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(objCanvasX, mirrorY);
      ctx.lineTo(objCanvasX, topY + 2);
      ctx.stroke();

      // Arrow head
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.moveTo(objCanvasX, topY);
      ctx.lineTo(objCanvasX - 5, topY + 10);
      ctx.lineTo(objCanvasX + 5, topY + 10);
      ctx.closePath();
      ctx.fill();

      // Base dot
      ctx.beginPath();
      ctx.arc(objCanvasX, mirrorY, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#fbbf24';
      ctx.fill();

      // Label
      ctx.fillStyle = '#fbbf24';
      ctx.font = '500 12px "Noto Sans JP", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('物体', objCanvasX, mirrorY + 18);
    }

    function drawFlame(x, y, sizeMul) {
      const s = sizeMul;
      // Outer flame
      ctx.beginPath();
      ctx.moveTo(x, y - 10 * s);
      ctx.quadraticCurveTo(x + 7 * s, y - 4 * s, x + 5 * s, y + 4 * s);
      ctx.quadraticCurveTo(x, y + 8 * s, x - 5 * s, y + 4 * s);
      ctx.quadraticCurveTo(x - 7 * s, y - 4 * s, x, y - 10 * s);
      const grad1 = ctx.createRadialGradient(x, y, 0, x, y, 10 * s);
      grad1.addColorStop(0, 'rgba(255, 255, 200, 0.9)');
      grad1.addColorStop(0.4, 'rgba(255, 200, 50, 0.8)');
      grad1.addColorStop(1, 'rgba(255, 100, 0, 0.6)');
      ctx.fillStyle = grad1;
      ctx.fill();

      // Inner bright
      ctx.beginPath();
      ctx.moveTo(x, y - 5 * s);
      ctx.quadraticCurveTo(x + 3 * s, y - 1 * s, x + 2 * s, y + 3 * s);
      ctx.quadraticCurveTo(x, y + 5 * s, x - 2 * s, y + 3 * s);
      ctx.quadraticCurveTo(x - 3 * s, y - 1 * s, x, y - 5 * s);
      ctx.fillStyle = 'rgba(255, 255, 220, 0.8)';
      ctx.fill();

      // Glow around flame
      ctx.beginPath();
      ctx.arc(x, y, 14 * s, 0, Math.PI * 2);
      const glowGrad = ctx.createRadialGradient(x, y, 2 * s, x, y, 14 * s);
      glowGrad.addColorStop(0, 'rgba(255, 200, 50, 0.15)');
      glowGrad.addColorStop(1, 'rgba(255, 200, 50, 0)');
      ctx.fillStyle = glowGrad;
      ctx.fill();
    }

    // ======== Compute Image ========
    function computeImage() {
      // For concave mirror: f > 0
      // For convex mirror: f < 0
      const f = mirrorType === 'concave' ? focalLength : -focalLength;
      const a = objectX; // object distance (positive)

      // Mirror formula: 1/f = 1/a + 1/b => b = af / (a - f)
      const denom = a - f;

      if (Math.abs(denom) < 1) {
        // Object at focal point: image at infinity
        return { valid: false, atInfinity: true, f, a, b: Infinity, m: Infinity };
      }

      const b = (a * f) / denom;
      const m = -b / a; // magnification

      return {
        valid: true,
        atInfinity: false,
        f, a, b, m,
        isReal: b > 0,
        isVirtual: b < 0,
        isInverted: m < 0,
        isUpright: m > 0,
        absM: Math.abs(m)
      };
    }

    // ======== Get mirror surface Y at a given X ========
    function getMirrorSurfaceX(yOffset) {
      const R = focalLength * 2;
      // For concave: center of curvature at mirrorX - R
      // surface X = centerX + sqrt(R^2 - yOffset^2)
      if (Math.abs(yOffset) >= R) return mirrorX;
      if (mirrorType === 'concave') {
        const centerX = mirrorX - R;
        return centerX + Math.sqrt(R * R - yOffset * yOffset);
      } else {
        const centerX = mirrorX + R;
        return centerX - Math.sqrt(R * R - yOffset * yOffset);
      }
    }

    // ======== Draw Rays ========

    // Ray 1: Parallel to axis → reflects through focal point (concave) / diverges from focal point (convex)
    function drawRay1(imageInfo) {
      const objCanvasX = mirrorX - objectX;
      const topY = mirrorY - objectHeight;
      const surfaceX = getMirrorSurfaceX(-objectHeight);

      const color = '#ef4444';
      const alphaColor = 'rgba(239, 68, 68, 0.5)';

      // Incoming ray: horizontal from object top to mirror
      drawArrowLine(objCanvasX, topY, surfaceX, topY, color, 2);

      if (mirrorType === 'concave') {
        // Reflected through F
        const fX = mirrorX - focalLength;
        // Extend beyond F
        const dx = fX - surfaceX;
        const dy = mirrorY - topY;
        const extLen = 800;
        const len = Math.sqrt(dx * dx + dy * dy);
        const endX = surfaceX + (dx / len) * extLen;
        const endY = topY + (dy / len) * extLen;

        if (imageInfo.valid && imageInfo.isReal) {
          drawArrowLine(surfaceX, topY, endX, endY, color, 2);
        } else {
          // Draw to mirror Y level, then extend
          drawArrowLine(surfaceX, topY, endX, endY, color, 2);
          // Virtual extension behind mirror
          if (imageInfo.valid && imageInfo.isVirtual) {
            const vEndX = surfaceX - (dx / len) * extLen;
            const vEndY = topY - (dy / len) * extLen;
            drawDashedLine(surfaceX, topY, vEndX, vEndY, alphaColor, 1.5);
          }
        }
      } else {
        // Convex: diverges as if coming from virtual F (behind mirror)
        const fX = mirrorX + focalLength; // virtual focal point behind mirror
        const dx = surfaceX - fX;
        const dy = topY - mirrorY;
        const len = Math.sqrt(dx * dx + dy * dy);
        const extLen = 800;
        const endX = surfaceX + (dx / len) * extLen;
        const endY = topY + (dy / len) * extLen;
        drawArrowLine(surfaceX, topY, endX, endY, color, 2);

        // Virtual ray extension behind mirror
        drawDashedLine(surfaceX, topY, fX, mirrorY, alphaColor, 1.5);
      }
    }

    // Ray 2: Through focal point → reflects parallel (concave) / toward focal point → reflects parallel (convex)
    function drawRay2(imageInfo) {
      const objCanvasX = mirrorX - objectX;
      const topY = mirrorY - objectHeight;

      const color = '#10b981';
      const alphaColor = 'rgba(16, 185, 129, 0.5)';

      if (mirrorType === 'concave') {
        const fX = mirrorX - focalLength;

        // Direction from object top toward F, find where it hits mirror
        const dx = fX - objCanvasX;
        const dy = mirrorY - topY;
        const len = Math.sqrt(dx * dx + dy * dy);

        // Find intersection with mirror surface approximately
        // Ray from (objCanvasX, topY) toward (fX, mirrorY)
        // At mirror surface, x ≈ surfaceX for the y at intersection
        // We do a simple parametric intersection
        const hitY = findMirrorHitY(objCanvasX, topY, dx / len, dy / len);
        const hitSurfaceX = getMirrorSurfaceX(hitY - mirrorY);

        // Incoming ray
        drawArrowLine(objCanvasX, topY, hitSurfaceX, hitY, color, 2);

        // Reflected: parallel to axis
        drawArrowLine(hitSurfaceX, hitY, -50, hitY, color, 2);
      } else {
        // Convex: ray aimed toward virtual F behind mirror → reflects parallel
        const fX = mirrorX + focalLength; // virtual F behind mirror
        const dx = fX - objCanvasX;
        const dy = mirrorY - topY;
        const len = Math.sqrt(dx * dx + dy * dy);

        const hitY = findMirrorHitY(objCanvasX, topY, dx / len, dy / len);
        const hitSurfaceX = getMirrorSurfaceX(hitY - mirrorY);

        // Incoming ray (only to mirror surface)
        drawArrowLine(objCanvasX, topY, hitSurfaceX, hitY, color, 2);

        // Virtual extension to F
        drawDashedLine(hitSurfaceX, hitY, fX, mirrorY, alphaColor, 1.5);

        // Reflected: parallel
        drawArrowLine(hitSurfaceX, hitY, -50, hitY, color, 2);
      }
    }

    // Ray 3: Through center of curvature → reflects back on itself
    function drawRay3(imageInfo) {
      const objCanvasX = mirrorX - objectX;
      const topY = mirrorY - objectHeight;

      const color = '#3b82f6';
      const alphaColor = 'rgba(59, 130, 246, 0.5)';

      if (mirrorType === 'concave') {
        const cX = mirrorX - 2 * focalLength;

        // Direction toward C
        const dx = cX - objCanvasX;
        const dy = mirrorY - topY;
        const len = Math.sqrt(dx * dx + dy * dy);

        const hitY = findMirrorHitY(objCanvasX, topY, dx / len, dy / len);
        const hitSurfaceX = getMirrorSurfaceX(hitY - mirrorY);

        drawArrowLine(objCanvasX, topY, hitSurfaceX, hitY, color, 2);

        // Reflects back along same path
        const extLen = 800;
        const rdx = objCanvasX - hitSurfaceX;
        const rdy = topY - hitY;
        const rlen = Math.sqrt(rdx * rdx + rdy * rdy);
        const endX = hitSurfaceX + (rdx / rlen) * extLen;
        const endY = hitY + (rdy / rlen) * extLen;
        drawArrowLine(hitSurfaceX, hitY, endX, endY, color, 2);
      } else {
        // Convex: toward virtual C behind mirror → reflects back
        const cX = mirrorX + 2 * focalLength;

        const dx = cX - objCanvasX;
        const dy = mirrorY - topY;
        const len = Math.sqrt(dx * dx + dy * dy);

        const hitY = findMirrorHitY(objCanvasX, topY, dx / len, dy / len);
        const hitSurfaceX = getMirrorSurfaceX(hitY - mirrorY);

        drawArrowLine(objCanvasX, topY, hitSurfaceX, hitY, color, 2);

        // Virtual extension to C
        drawDashedLine(hitSurfaceX, hitY, cX, mirrorY, alphaColor, 1.5);

        // Reflects back
        const extLen = 800;
        const rdx = objCanvasX - hitSurfaceX;
        const rdy = topY - hitY;
        const rlen = Math.sqrt(rdx * rdx + rdy * rdy);
        const endX = hitSurfaceX + (rdx / rlen) * extLen;
        const endY = hitY + (rdy / rlen) * extLen;
        drawArrowLine(hitSurfaceX, hitY, endX, endY, color, 2);
      }
    }

    function findMirrorHitY(startX, startY, dirX, dirY) {
      // Simple parametric search for intersection with mirror surface
      const R = focalLength * 2;
      let t = 0;
      const step = 2;
      for (let i = 0; i < 2000; i++) {
        t += step;
        const px = startX + dirX * t;
        const py = startY + dirY * t;
        const surfX = getMirrorSurfaceX(py - mirrorY);
        if (mirrorType === 'concave') {
          if (px >= surfX - 2) return py;
        } else {
          if (px >= surfX - 2) return py;
        }
      }
      return mirrorY;
    }

    // ======== Draw Image ========
    function drawImage(info) {
      const imgHeight = objectHeight * info.m;
      let imgCanvasX;

      if (info.isReal) {
        imgCanvasX = mirrorX - info.b; // real image on same side as object
      } else {
        imgCanvasX = mirrorX - info.b; // virtual image: b < 0, so this is mirrorX + |b| (behind mirror)
      }

      const imgTopY = mirrorY + imgHeight; // because m can be negative

      // Image arrow
      if (info.isVirtual) {
        // Dashed for virtual
        ctx.setLineDash([6, 4]);
      }

      const imgColor = info.isReal ? '#10b981' : '#ec4899';
      ctx.strokeStyle = imgColor;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(imgCanvasX, mirrorY);
      ctx.lineTo(imgCanvasX, imgTopY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Arrow head on image
      const arrowDir = imgHeight < 0 ? -1 : 1;
      ctx.fillStyle = imgColor;
      ctx.beginPath();
      ctx.moveTo(imgCanvasX, imgTopY);
      ctx.lineTo(imgCanvasX - 5, imgTopY - 10 * arrowDir);
      ctx.lineTo(imgCanvasX + 5, imgTopY - 10 * arrowDir);
      ctx.closePath();
      ctx.fill();

      // Base dot
      ctx.beginPath();
      ctx.arc(imgCanvasX, mirrorY, 3, 0, Math.PI * 2);
      ctx.fillStyle = imgColor;
      ctx.fill();

      // Label
      ctx.fillStyle = imgColor;
      ctx.font = '500 12px "Noto Sans JP", sans-serif';
      ctx.textAlign = 'center';
      const labelY = info.isInverted ? mirrorY + 18 : mirrorY + 18;
      ctx.fillText(info.isReal ? '実像' : '虚像', imgCanvasX, labelY);

      // Glow effect on image
      ctx.beginPath();
      const glowSize = Math.min(Math.abs(imgHeight) * 0.5, 30);
      ctx.arc(imgCanvasX, imgTopY, glowSize, 0, Math.PI * 2);
      const r = info.isReal ? 16 : 236;
      const g = info.isReal ? 185 : 72;
      const b = info.isReal ? 129 : 153;
      const glowG = ctx.createRadialGradient(imgCanvasX, imgTopY, 0, imgCanvasX, imgTopY, glowSize);
      glowG.addColorStop(0, `rgba(${r},${g},${b},0.2)`);
      glowG.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = glowG;
      ctx.fill();
    }

    // ======== Utility drawing ========
    function drawArrowLine(x1, y1, x2, y2, color, width) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawDashedLine(x1, y1, x2, y2, color, width) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // ======== Update UI ========
    function updateUI(info) {
      const f = info.f;
      const a = info.a;

      // Formula display
      document.getElementById('dispF').textContent = f.toFixed(1);
      document.getElementById('dispF').className = 'value ' + (f > 0 ? 'positive' : 'negative');

      document.getElementById('dispA').textContent = a.toFixed(1);
      document.getElementById('dispA').className = 'value positive';

      if (info.atInfinity) {
        document.getElementById('dispB').textContent = '∞';
        document.getElementById('dispB').className = 'value infinity';
        document.getElementById('dispM').textContent = '∞';
        document.getElementById('dispM').className = 'value infinity';
      } else {
        document.getElementById('dispB').textContent = info.b.toFixed(1);
        document.getElementById('dispB').className = 'value ' + (info.b > 0 ? 'positive' : 'negative');
        document.getElementById('dispM').textContent = info.m.toFixed(2);
        document.getElementById('dispM').className = 'value ' + (info.m > 0 ? 'positive' : 'negative');
      }

      // Image properties tags
      const propsEl = document.getElementById('imageProps');
      const expEl = document.getElementById('explanation');

      if (info.atInfinity) {
        propsEl.innerHTML = '<span class="prop-tag none">像なし（無限遠）</span>';
        expEl.textContent = '物体が焦点(F)上にあるとき、反射光線は平行になり、像は無限遠にできます（実際には像はできません）。';
        return;
      }

      if (!info.valid) return;

      let tags = '';

      // Real / Virtual
      tags += info.isReal
        ? '<span class="prop-tag real">実像</span>'
        : '<span class="prop-tag virtual">虚像</span>';

      // Upright / Inverted
      tags += info.isInverted
        ? '<span class="prop-tag inverted">倒立</span>'
        : '<span class="prop-tag upright">正立</span>';

      // Size
      const absM = info.absM;
      if (Math.abs(absM - 1) < 0.05) {
        tags += '<span class="prop-tag same">等倍</span>';
      } else if (absM > 1) {
        tags += '<span class="prop-tag enlarged">拡大</span>';
      } else {
        tags += '<span class="prop-tag reduced">縮小</span>';
      }

      propsEl.innerHTML = tags;

      // Explanation
      expEl.textContent = getExplanation(info);
    }

    function getExplanation(info) {
      const f = Math.abs(info.f);
      const a = info.a;

      if (mirrorType === 'concave') {
        if (a > 2 * f + 5) {
          return 'Cより遠い位置に物体があるとき、FとCの間に縮小・倒立の実像ができます。物体を遠ざけるほど像は小さくなります。';
        } else if (Math.abs(a - 2 * f) < 5) {
          return '物体がC（曲率中心）にあるとき、同じCの位置に等倍・倒立の実像ができます。';
        } else if (a > f + 3 && a < 2 * f - 3) {
          return 'FとCの間に物体があるとき、Cより遠い位置に拡大・倒立の実像ができます。';
        } else if (Math.abs(a - f) < 3) {
          return '物体が焦点F上にあるとき、反射光は平行になり像はできません（無限遠）。';
        } else if (a < f) {
          return '物体が焦点Fより鏡に近いとき、鏡の裏側に拡大・正立の虚像ができます。虫眼鏡のように拡大して見えます。';
        }
        return '凹面鏡：物体の位置によって、実像または虚像ができます。';
      } else {
        return '凸面鏡では常に鏡の裏側に縮小・正立の虚像ができます。カーブミラーで遠くの景色が小さく映るのと同じ原理です。';
      }
    }

    // ======== Interaction ========
    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function isNearObject(pos) {
      const objCanvasX = mirrorX - objectX;
      return Math.abs(pos.x - objCanvasX) < 30 && pos.y > mirrorY - objectHeight - 20 && pos.y < mirrorY + 20;
    }

    canvas.addEventListener('mousedown', (e) => {
      const pos = getCanvasPos(e);
      if (isNearObject(pos)) {
        dragging = true;
        canvas.style.cursor = 'grabbing';
        hideHint();
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      const pos = getCanvasPos(e);
      if (dragging) {
        objectX = Math.max(20, Math.min(mirrorX - 30, mirrorX - pos.x));
        draw();
      } else {
        canvas.style.cursor = isNearObject(pos) ? 'grab' : 'default';
      }
    });

    canvas.addEventListener('mouseup', () => {
      dragging = false;
      canvas.style.cursor = 'default';
    });

    canvas.addEventListener('mouseleave', () => {
      dragging = false;
    });

    // Touch events
    canvas.addEventListener('touchstart', (e) => {
      const pos = getCanvasPos(e);
      if (isNearObject(pos)) {
        dragging = true;
        hideHint();
        e.preventDefault();
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (dragging) {
        const pos = getCanvasPos(e);
        objectX = Math.max(20, Math.min(mirrorX - 30, mirrorX - pos.x));
        draw();
        e.preventDefault();
      }
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      dragging = false;
    });

    // ======== Controls ========
    // Mirror type toggle
    document.querySelectorAll('.mirror-toggle button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mirror-toggle button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mirrorType = btn.dataset.type;
        draw();
      });
    });

    // Focal length slider
    document.getElementById('focalSlider').addEventListener('input', (e) => {
      focalLength = parseInt(e.target.value);
      document.getElementById('focalValue').textContent = focalLength + ' px';
      // Ensure object isn't past mirror
      objectX = Math.min(objectX, mirrorX - 30);
      draw();
    });

    // Object height slider
    document.getElementById('heightSlider').addEventListener('input', (e) => {
      objectHeight = parseInt(e.target.value);
      document.getElementById('heightValue').textContent = objectHeight + ' px';
      draw();
    });

    // Ray toggles
    document.getElementById('ray1').addEventListener('change', (e) => { showRay1 = e.target.checked; draw(); });
    document.getElementById('ray2').addEventListener('change', (e) => { showRay2 = e.target.checked; draw(); });
    document.getElementById('ray3').addEventListener('change', (e) => { showRay3 = e.target.checked; draw(); });

    // Hint
    function hideHint() {
      const hint = document.getElementById('hint');
      hint.style.opacity = '0';
    }

    hintTimeout = setTimeout(() => {
      hideHint();
    }, 8000);

    // ======== Init ========
    resize();
    draw();
  </script>
</body>
</html>
