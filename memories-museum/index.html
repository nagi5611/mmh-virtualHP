<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思い出の品々 - 南高3D博物館</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #212529;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* プリローダー */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.2s ease;
            overflow: hidden;
        }
        
        .preloader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .preloader.exit-animation {
            opacity: 1;
        }
        
        .preloader-content {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 100px;
        }
        
        /* ばーちゃるず文字 */
        .loader-logo {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-text {
            font-size: 48px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 2;
            transition: all 0.2s ease;
        }
        
        .logo-text.exit-left {
            transform: translateX(-100vw);
            opacity: 0;
        }
        
        .logo-text.exit-right {
            transform: translateX(100vw);
            opacity: 0;
        }
        
        /* 文字の周りを回る線 */
        .rotating-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            border: 2px solid transparent;
            border-top: 2px solid #ff6b9d;
            border-right: 2px solid #2da597;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: rotate-line 2s linear infinite;
            transition: all 0.3s ease;
        }
        
        .rotating-line.exit-left {
            transform: translate(-50%, -50%) translateX(-100vw);
            opacity: 0;
        }
        
        .rotating-line.exit-right {
            transform: translate(-50%, -50%) translateX(100vw);
            opacity: 0;
        }
        
        /* 下の方のロードバー */
        .load-bar-container {
            position: relative;
            width: 400px;
            height: 60px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            overflow: visible;
        }
        
        .load-bar-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        
        .dna-ball {
            position: absolute;
            top: 50%;
            left: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translateY(-50%);
            transition: none;
            z-index: 2;
        }
        
        .dna-ball.red {
            background: #ff6b9d;
            box-shadow: 0 0 15px #ff6b9d, 0 0 25px rgba(255, 107, 157, 0.5);
        }
        
        .dna-ball.blue {
            background: #2da597;
            box-shadow: 0 0 15px #2da597, 0 0 25px rgba(45, 165, 151, 0.5);
        }
        
        .dna-trail-point {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            transition: all 0.5s linear;
            z-index: 1;
            opacity: 0.8;
        }
        
        .dna-trail-point.red-trail {
            background: rgba(255, 107, 157, 0.7);
            box-shadow: 0 0 6px rgba(255, 107, 157, 0.5);
        }
        
        .dna-trail-point.blue-trail {
            background: rgba(45, 165, 151, 0.7);
            box-shadow: 0 0 6px rgba(45, 165, 151, 0.5);
        }
        
        .dna-trail-point.fade-out {
            opacity: 0;
            transform: scale(0.3);
        }
        
        .progress-percentage {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        
        .progress-percentage.exit {
            opacity: 0;
            transform: translateY(20px);
        }
        
        .dna-trail {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .dna-trail::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 107, 157, 0.3) 25%, 
                rgba(45, 165, 151, 0.3) 50%, 
                rgba(255, 107, 157, 0.3) 75%, 
                transparent 100%
            );
            transform: translateY(-50%);
            opacity: 0.5;
        }
        
        .dna-path {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .dna-path svg {
            width: 100%;
            height: 100%;
        }
        
        .dna-path path {
            fill: none;
            stroke: rgba(255, 107, 157, 0.2);
            stroke-width: 1;
            stroke-dasharray: 3, 3;
            animation: dna-path-flow 3s linear infinite;
        }
        
        .dna-path path:nth-child(2) {
            stroke: rgba(45, 165, 151, 0.2);
            animation-delay: 1.5s;
        }
        
        @keyframes dna-path-flow {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 20; }
        }
        
        .dna-trail::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: repeating-linear-gradient(90deg, 
                transparent 0px, 
                rgba(255, 255, 255, 0.1) 10px, 
                transparent 20px
            );
            transform: translateY(-50%);
            animation: dna-trail-flow 2s linear infinite;
        }
        
        @keyframes dna-trail-flow {
            0% { transform: translateY(-50%) translateX(0); }
            100% { transform: translateY(-50%) translateX(20px); }
        }
        
        .metaverse-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 107, 157, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(45, 165, 151, 0.1) 0%, transparent 50%);
            animation: bg-shift 8s ease-in-out infinite;
        }
        
        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-move 10s linear infinite;
        }
        
        @keyframes rotate-line {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        @keyframes bg-shift {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
        }
        
        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        @media (max-width: 480px) {
            .logo-text {
                font-size: 32px;
            }
            
            .rotating-line {
                width: 150px;
                height: 150px;
            }
            
            .load-bar-container {
                width: 300px;
                height: 50px;
            }
            
            .dna-ball {
                width: 10px;
                height: 10px;
            }
            
            .dna-trail-point {
                width: 4px;
                height: 4px;
            }
            
            .progress-percentage {
                font-size: 14px;
                margin-top: 15px;
            }
        }
        
        /* メインコンテンツ */
        .main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 1s ease;
        }
        
        .main-content.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* ヘッダー */
        .museum-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(255, 107, 157, 0.1);
        }
        
        .museum-nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        
        .museum-logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b9d, #2da597);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        
        .nav-buttons {
            display: flex;
            gap: 15px;
        }
        
        .nav-btn {
            padding: 8px 16px;
            border: 2px solid #ff6b9d;
            background: transparent;
            color: #ff6b9d;
            border-radius: 25px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .nav-btn:hover {
            background: #ff6b9d;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
        }
        
        /* ヒーローセクション */
        .hero-section {
            text-align: center;
            padding: 80px 20px;
            position: relative;
            overflow: hidden;
        }
        
        .hero-title {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b9d, #2da597);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
        }
        
        .hero-subtitle {
            font-size: 1.2rem;
            color: #6c757d;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInUp 1s ease 1s forwards;
        }
        
        /* 検索とフィルター */
        .museum-controls {
            max-width: 1200px;
            margin: 0 auto 50px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 20px;
            align-items: center;
        }
        
        .search-box {
            position: relative;
        }
        
        .search-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: 2px solid rgba(255, 107, 157, 0.2);
            border-radius: 30px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #ff6b9d;
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.1);
        }
        
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff6b9d;
            font-size: 1.2rem;
        }
        
        .view-toggle {
            display: flex;
            border: 2px solid rgba(255, 107, 157, 0.2);
            border-radius: 25px;
            overflow: hidden;
        }
        
        .view-btn {
            padding: 10px 15px;
            border: none;
            background: transparent;
            color: #6c757d;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .view-btn.active {
            background: #ff6b9d;
            color: white;
        }
        
        .item-counter {
            font-size: 1rem;
            color: #6c757d;
            font-weight: 500;
        }
        
        /* ギャラリー */
        .museum-gallery {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }
        
        .gallery-item {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 107, 157, 0.1);
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(30px);
            position: relative;
            overflow: hidden;
        }
        
        .gallery-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 107, 157, 0.1), transparent);
            transition: left 0.6s;
        }
        
        .gallery-item:hover::before {
            left: 100%;
        }
        
        .gallery-item:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.2);
            border-color: #ff6b9d;
        }
        
        .gallery-item.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .item-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2da597;
        }
        
        .item-number {
            background: linear-gradient(45deg, #ff6b9d, #2da597);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .item-viewer {
            width: 100%;
            height: 300px;
            border-radius: 15px;
            border: 1px solid rgba(255, 107, 157, 0.2);
            margin-bottom: 15px;
            overflow: hidden;
            position: relative;
            background: #f8f9fa;
        }
        
        .item-viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #6c757d;
        }
        
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 107, 157, 0.3);
            border-top: 3px solid #ff6b9d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .item-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #2da597;
            background: transparent;
            color: #2da597;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .action-btn:hover {
            background: #2da597;
            color: white;
            transform: translateY(-2px);
        }
        
        .action-btn.fullscreen {
            border-color: #ff6b9d;
            color: #ff6b9d;
        }
        
        .action-btn.fullscreen:hover {
            background: #ff6b9d;
            color: white;
        }
        
        .reload-btn {
            width: 35px;
            height: 35px;
            border: 2px solid #6c757d;
            background: transparent;
            color: #6c757d;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        
        .reload-btn:hover {
            background: #6c757d;
            color: white;
            transform: rotate(180deg);
        }
        
        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            animation: fadeIn 0.3s ease;
        }
        
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 80%;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            background: linear-gradient(135deg, #ff6b9d, #2da597);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            transform: scale(1.1) rotate(90deg);
        }
        
        .modal-viewer {
            width: 100%;
            height: calc(100% - 80px);
            border: none;
        }
        
        /* パーティクル */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff6b9d;
            border-radius: 50%;
            animation: float 8s infinite linear;
            opacity: 0.3;
            box-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
        }
        
        /* アニメーション */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
                transform: translateY(90vh) rotate(36deg) scale(1);
            }
            90% {
                opacity: 0.3;
                transform: translateY(10vh) rotate(324deg) scale(1);
            }
            100% {
                transform: translateY(-100px) rotate(360deg) scale(0);
                opacity: 0;
            }
        }
        
        /* レスポンシブ */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            
            .museum-controls {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                width: 95%;
                height: 85%;
            }
        }
    </style>
</head>
<body>
    <!-- プリローダー -->
    <div class="preloader" id="preloader">
        <div class="metaverse-bg"></div>
        <div class="grid-lines"></div>
        <div class="preloader-content">
            <div class="loader-logo">
                <div class="logo-text">ばーちゃるず</div>
                <div class="rotating-line"></div>
            </div>
            <div class="load-bar-container">
                <div class="dna-trail"></div>
                <div class="load-bar-track">
                    <div class="dna-ball red"></div>
                    <div class="dna-ball blue"></div>
                </div>
            </div>
            <div class="progress-percentage">0%</div>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="main-content" id="mainContent">
        <!-- パーティクル背景 -->
        <div class="particles" id="particles"></div>
        
        <!-- ヘッダー -->
        <header class="museum-header">
            <nav class="museum-nav">
                <a href="../" class="museum-logo">南高3D博物館</a>
                <div class="nav-buttons">
                    <a href="../" class="nav-btn">ホームに戻る</a>
                    <button class="nav-btn" onclick="toggleGridView()">表示切替</button>
                </div>
            </nav>
        </header>
        
        <!-- ヒーローセクション -->
        <section class="hero-section">
            <h1 class="hero-title">思い出の品々</h1>
            <p class="hero-subtitle">134年の歴史を持つ松山南高校の貴重な品々を3Dで永久保存</p>
        </section>
        
        <!-- コントロール -->
        <div class="museum-controls">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="品名で検索..." id="searchInput">
                <span class="search-icon">🔍</span>
            </div>
            <div class="view-toggle">
                <button class="view-btn active" data-view="grid">ギャラリー</button>
                <button class="view-btn" data-view="list">リスト</button>
            </div>
            <div class="item-counter">
                全 <span id="itemCount">22</span> 点
            </div>
        </div>
        
        <!-- ギャラリー -->
        <main class="museum-gallery">
            <div class="gallery-grid" id="galleryGrid">
                <!-- アイテムはJavaScriptで動的に生成 -->
            </div>
        </main>
        
        <!-- モーダル -->
        <div class="modal" id="itemModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title" id="modalTitle">3D詳細ビュー</h2>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>
                <iframe class="modal-viewer" id="modalViewer" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>
    
    <script>
        // プリローダーアニメーション
        function animatePreloader() {
            const redBall = document.querySelector('.dna-ball.red');
            const blueBall = document.querySelector('.dna-ball.blue');
            const logoText = document.querySelector('.logo-text');
            const rotatingLine = document.querySelector('.rotating-line');
            const progressPercentage = document.querySelector('.progress-percentage');
            const container = document.querySelector('.load-bar-container');
            
            let progress = 0;
            let trailPoints = [];
            
            const createTrailPoint = (x, y, type) => {
                const trailPoint = document.createElement('div');
                trailPoint.className = `dna-trail-point ${type}-trail`;
                trailPoint.style.left = (x - 3) + 'px';
                trailPoint.style.top = (y - 3) + 'px';
                container.appendChild(trailPoint);
                
                setTimeout(() => {
                    trailPoint.classList.add('fade-out');
                    setTimeout(() => {
                        if (trailPoint.parentNode) {
                            trailPoint.parentNode.removeChild(trailPoint);
                        }
                    }, 200);
                }, 200);
                
                return trailPoint;
            };
            
            const animateProgress = () => {
                if (progress <= 100) {
                    const containerWidth = container.offsetWidth;
                    const ballWidth = redBall.offsetWidth;
                    const maxPosition = containerWidth - ballWidth;
                    const xPosition = (progress / 100) * maxPosition;
                    
                    const angle = (progress / 100) * Math.PI * 10;
                    const amplitude = 10;
                    const centerY = 25;
                    
                    const redY = centerY + Math.sin(angle) * amplitude;
                    redBall.style.left = xPosition + 'px';
                    redBall.style.top = redY + 'px';
                    
                    const blueY = centerY + Math.sin(angle + Math.PI) * amplitude;
                    blueBall.style.left = xPosition + 'px';
                    blueBall.style.top = blueY + 'px';
                    
                    createTrailPoint(xPosition + ballWidth/2, redY + ballWidth/2, 'red');
                    createTrailPoint(xPosition + ballWidth/2, blueY + ballWidth/2, 'blue');
                    
                    const rotateAngle = (progress / 100) * 360 * 16;
                    redBall.style.transform = `rotate(${rotateAngle}deg)`;
                    blueBall.style.transform = `rotate(${-rotateAngle}deg)`;
                    
                    const scale = 1 + 0.2 * Math.sin(angle * 10);
                    redBall.style.transform += ` scale(${scale})`;
                    blueBall.style.transform += ` scale(${scale})`;
                    
                    progressPercentage.textContent = Math.round(progress) + '%';
                    
                    progress += 1;
                    setTimeout(animateProgress, 20);
                } else {
                    setTimeout(() => {
                        startExitAnimation();
                    }, 300);
                }
            };
            
            const startExitAnimation = () => {
                progressPercentage.classList.add('exit');
                
                const text = logoText.textContent;
                const leftText = text.slice(0, Math.ceil(text.length / 2));
                const rightText = text.slice(Math.ceil(text.length / 2));
                
                const originalStyle = window.getComputedStyle(logoText);
                
                const leftSpan = document.createElement('div');
                leftSpan.textContent = leftText;
                leftSpan.style.cssText = `
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-100%, -50%);
                    font-size: ${originalStyle.fontSize};
                    font-weight: ${originalStyle.fontWeight};
                    color: ${originalStyle.color};
                    text-shadow: ${originalStyle.textShadow};
                    transition: all 0.5s ease;
                    z-index: 3;
                `;
                
                const rightSpan = document.createElement('div');
                rightSpan.textContent = rightText;
                rightSpan.style.cssText = `
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(0%, -50%);
                    font-size: ${originalStyle.fontSize};
                    font-weight: ${originalStyle.fontWeight};
                    color: ${originalStyle.color};
                    text-shadow: ${originalStyle.textShadow};
                    transition: all 0.5s ease;
                    z-index: 3;
                `;
                
                logoText.style.opacity = '0';
                
                const logoContainer = logoText.parentNode;
                logoContainer.appendChild(leftSpan);
                logoContainer.appendChild(rightSpan);
                
                setTimeout(() => {
                    leftSpan.style.transform = 'translate(-200vw, -50%)';
                    leftSpan.style.opacity = '0';
                    rightSpan.style.transform = 'translate(200vw, -50%)';
                    rightSpan.style.opacity = '0';
                }, 100);
                
                const leftLine = rotatingLine.cloneNode(true);
                const rightLine = rotatingLine.cloneNode(true);
                
                leftLine.style.cssText = rotatingLine.style.cssText + `
                    transition: all 0.5s ease;
                `;
                rightLine.style.cssText = rotatingLine.style.cssText + `
                    transition: all 0.5s ease;
                `;
                
                rotatingLine.parentNode.appendChild(leftLine);
                rotatingLine.parentNode.appendChild(rightLine);
                rotatingLine.style.opacity = '0';
                
                setTimeout(() => {
                    leftLine.style.transform = 'translate(-50%, -50%) translateX(-200vw)';
                    leftLine.style.opacity = '0';
                    rightLine.style.transform = 'translate(-50%, -50%) translateX(200vw)';
                    rightLine.style.opacity = '0';
                }, 100);
                
                setTimeout(() => {
                    hidePreloader();
                }, 600);
            };
            
            setTimeout(animateProgress, 200);
        }
        
        function hidePreloader() {
            const preloader = document.getElementById('preloader');
            const mainContent = document.getElementById('mainContent');
            
            preloader.classList.add('hidden');
            mainContent.classList.add('show');
            
            setTimeout(() => {
                preloader.style.display = 'none';
            }, 500);
        }

        // 3Dモデルデータ
        const museumItems = [
            'https://scaniverse.com/scan/ygrkqf7wt4itj3jh?embed=1',
            'https://scaniverse.com/scan/tow4f4mnc3liww7n?embed=1',
            'https://scaniverse.com/scan/h45tjfa6hra5a2g3?embed=1',
            'https://scaniverse.com/scan/byj5imdk4oemz3t6?embed=1',
            'https://scaniverse.com/scan/q6zrbwy4rftpcq4y?embed=1',
            'https://scaniverse.com/scan/ub2hictiwdkypf3p?embed=1',
            'https://scaniverse.com/scan/sbxosjc7vxua3kcy?embed=1',
            'https://scaniverse.com/scan/4sswajdp2agucn5u?embed=1',
            'https://scaniverse.com/scan/ebp3bqsjvusn7e64?embed=1',
            'https://scaniverse.com/scan/imncfh7hqsrjfwe7?embed=1',
            'https://scaniverse.com/scan/lno46bqlkr6nhwla?embed=1',
            'https://scaniverse.com/scan/7a4dnsttn5ghltcu?embed=1',
            'https://scaniverse.com/scan/42lfmde7s2orskfp?embed=1',
            'https://scaniverse.com/scan/pu6ce3an4warkz25?embed=1',
            'https://scaniverse.com/scan/z4a5hqfbhuqgmlg4?embed=1',
            'https://scaniverse.com/scan/3j6xzzubatfebs6q?embed=1',
            'https://scaniverse.com/scan/w4lteochgvcgml3s?embed=1',
            'https://scaniverse.com/scan/3navoqbliclnmk5w?embed=1',
            'https://scaniverse.com/scan/uirlwkhsyl6e3pfx?embed=1',
            'https://scaniverse.com/scan/ohbfahwq5qosg2jb?embed=1',
            'https://scaniverse.com/scan/arbis3bjr5mry4wv?embed=1'
        ];
        
        // アイテム名（仮）
        const itemNames = [
            '給水機', '石碑', '鍵入れ', '南高太鼓',
            '俵', '鍵箱', '雑巾', '赤本', 'ゴミ箱',
            '本置き場', '図書館PC', '図書館カウンター', '美術室の看板', '図書館窓辺のコーナー',
            '回転式本棚1', '回転式本棚2', '脚立1', '脚立2', '図書館一部',
            '本棚', '図書館のカエル'
        ];
        
        let currentView = 'grid';
        let filteredItems = [...museumItems];
        
        // パーティクル生成
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 6) + 's';
                
                const colors = ['#ff6b9d', '#2da597', '#6f42c1', '#fd7e14'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.background = color;
                particle.style.boxShadow = `0 0 10px ${color}80`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // ギャラリーアイテム生成
        function createGalleryItem(url, index) {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <div class="item-header">
                    <h3 class="item-title">${itemNames[index]}</h3>
                    <span class="item-number">#${String(index + 1).padStart(2, '0')}</span>
                </div>
                <div class="item-viewer">
                    <div class="loading-indicator">
                        <div class="spinner"></div>
                        <span>3Dモデル読み込み中...</span>
                    </div>
                    <iframe src="${url}" allowfullscreen style="display:none;"></iframe>
                </div>
                <div class="item-actions">
                    <button class="action-btn" onclick="shareItem(${index})">📤 共有</button>
                    <button class="action-btn fullscreen" onclick="openModal('${url}', '${itemNames[index]}')">🔍 詳細表示</button>
                    <button class="reload-btn" onclick="reloadItem(${index})" title="リロード">🔄</button>
                </div>
            `;
            
            // iframe読み込み完了時の処理
            const iframe = item.querySelector('iframe');
            const loadingIndicator = item.querySelector('.loading-indicator');
            
            iframe.onload = () => {
                setTimeout(() => {
                    loadingIndicator.style.display = 'none';
                    iframe.style.display = 'block';
                }, 1000);
            };
            
            return item;
        }
        
        // ギャラリー描画
        function renderGallery() {
            const gallery = document.getElementById('galleryGrid');
            gallery.innerHTML = '';
            
            filteredItems.forEach((url, index) => {
                const originalIndex = museumItems.indexOf(url);
                const item = createGalleryItem(url, originalIndex);
                gallery.appendChild(item);
            });
            
            // アニメーション適用
            setTimeout(() => {
                const items = document.querySelectorAll('.gallery-item');
                items.forEach((item, index) => {
                    setTimeout(() => {
                        item.classList.add('show');
                    }, index * 100);
                });
            }, 100);
            
            // アイテム数更新
            document.getElementById('itemCount').textContent = filteredItems.length;
        }
        
        // 検索機能
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                filteredItems = museumItems.filter((url, index) => 
                    itemNames[index].toLowerCase().includes(query)
                );
                renderGallery();
            });
        }
        
        // 表示切替
        function setupViewToggle() {
            const viewBtns = document.querySelectorAll('.view-btn');
            viewBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    viewBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentView = btn.dataset.view;
                    
                    const gallery = document.getElementById('galleryGrid');
                    if (currentView === 'list') {
                        gallery.style.gridTemplateColumns = '1fr';
                    } else {
                        gallery.style.gridTemplateColumns = 'repeat(auto-fit, minmax(350px, 1fr))';
                    }
                });
            });
        }
        
        // モーダル機能
        function openModal(url, title) {
            const modal = document.getElementById('itemModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalViewer = document.getElementById('modalViewer');
            
            modalTitle.textContent = title;
            modalViewer.src = url;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            const modal = document.getElementById('itemModal');
            const modalViewer = document.getElementById('modalViewer');
            
            modal.style.display = 'none';
            modalViewer.src = '';
            document.body.style.overflow = 'auto';
        }
        
        // 共有機能
        function shareItem(index) {
            const url = window.location.href + '#item-' + (index + 1);
            const title = itemNames[index];
            
            if (navigator.share) {
                navigator.share({
                    title: `南高3D博物館 - ${title}`,
                    text: `松山南高校の${title}を3Dで見てみよう！`,
                    url: url
                });
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    alert('リンクをコピーしました！');
                });
            }
        }
        
        // グリッド表示切替
        function toggleGridView() {
            const gallery = document.getElementById('galleryGrid');
            const currentColumns = window.getComputedStyle(gallery).gridTemplateColumns;
            
            if (currentColumns.includes('350px')) {
                gallery.style.gridTemplateColumns = 'repeat(auto-fit, minmax(250px, 1fr))';
            } else {
                gallery.style.gridTemplateColumns = 'repeat(auto-fit, minmax(350px, 1fr))';
            }
        }
        
        // リロード機能
        function reloadItem(originalIndex) {
            const galleryItems = document.querySelectorAll('.gallery-item');
            
            // 元のインデックスに対応するアイテムを見つける
            for (let i = 0; i < galleryItems.length; i++) {
                const item = galleryItems[i];
                const itemNumber = item.querySelector('.item-number').textContent;
                if (itemNumber === `#${String(originalIndex + 1).padStart(2, '0')}`) {
                    const iframe = item.querySelector('iframe');
                    const loadingIndicator = item.querySelector('.loading-indicator');
                    
                    // ローディング表示
                    loadingIndicator.style.display = 'flex';
                    iframe.style.display = 'none';
                    
                    // iframeをリロード
                    const currentSrc = iframe.src;
                    iframe.src = '';
                    setTimeout(() => {
                        iframe.src = currentSrc;
                    }, 100);
                    break;
                }
            }
        }
        
        // スクロールアニメーション
        function handleScrollAnimations() {
            const items = document.querySelectorAll('.gallery-item:not(.show)');
            items.forEach(item => {
                const rect = item.getBoundingClientRect();
                if (rect.top < window.innerHeight - 100) {
                    item.classList.add('show');
                }
            });
        }
        
        // キーボードショートカット
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
                if (e.ctrlKey && e.key === '/') {
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                }
            });
        }
        
        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            // プリローダーアニメーション開始
            animatePreloader();
            
            // 少し待ってから初期化
            setTimeout(() => {
                createParticles();
                renderGallery();
                setupSearch();
                setupViewToggle();
                setupKeyboardShortcuts();
                
                // スクロールイベント
                window.addEventListener('scroll', handleScrollAnimations);
                
                // モーダル外クリックで閉じる
                document.getElementById('itemModal').addEventListener('click', (e) => {
                    if (e.target.id === 'itemModal') {
                        closeModal();
                    }
                });
            }, 1000);
        });
    </script>
